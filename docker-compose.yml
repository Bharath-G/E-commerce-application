services:
  # --- Infrastructure ---
  oracle-db:
    image: gvenzl/oracle-xe
    container_name: oracle-db
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: system123
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-kraft:
    image: apache/kafka:3.7.0
    container_name: kafka-kraft
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-kraft:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-kraft:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # --- Config Server ---
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      ENCRYPT_KEY: MySecretMasterKey123
    volumes:
      - ./config-repo:/config-repo
    # Override search location for Docker
    command: ["java", "-jar", "/app.jar", "--spring.cloud.config.server.git.uri=file:///config-repo"]

  # --- Microservices ---
  order-service:
    build: ./orderservice
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888/"
    depends_on:
      config-server:
        condition: service_started
      oracle-db:
        condition: service_healthy

  payment-service:
    build: ./paymentservice
    container_name: payment-service
    ports:
      - "8082:8082"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888/"
    depends_on:
      config-server:
        condition: service_started
      oracle-db:
        condition: service_healthy

  notification-service:
    build: ./notificationservice
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888/"
    depends_on:
      config-server:
        condition: service_started
      oracle-db:
        condition: service_healthy